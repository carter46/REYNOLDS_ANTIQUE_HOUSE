<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection | Reynolds Antique House</title>
  <meta name="description" content="Browse the Reynolds Antique House collection." />
  <meta name="theme-color" content="#1a1410" />
  <link rel="stylesheet" href="/assets/css/chrome.css" />
</head>
<body data-page="products">
  <div id="site-header-root"></div>
  <main id="main">
<section class="rah-page">
        <h1 class="rah-section-title">Collection</h1>
        <p class="rah-section-lead">342 pieces with complete local imagery.</p>
        <div class="rah-filters" id="category-filters">
          <button type="button" data-cat="all" class="is-active">All</button>
          <button type="button" data-cat="accessories">accessories</button>
<button type="button" data-cat="art.html">art.html</button>
<button type="button" data-cat="decor">decor</button>
<button type="button" data-cat="funiture">funiture</button>
<button type="button" data-cat="furniture.html">furniture.html</button>
<button type="button" data-cat="lighting.html">lighting.html</button>
<button type="button" data-cat="mirrors.html">mirrors.html</button>
<button type="button" data-cat="sculpture.html">sculpture.html</button>
        </div>
        <div class="rah-grid" id="product-grid"></div>
      </section>
      <script src="/js/product-catalog.js"></script>
      <script>
        (async function () {
          const data = await ReynoldsCatalog.load();
          const grid = document.getElementById("product-grid");
          function render(list) {
            grid.innerHTML = list.map(ReynoldsCatalog.cardHtml).join("");
          }
          render(data.products);
          document.getElementById("category-filters").addEventListener("click", function (e) {
            const btn = e.target.closest("button[data-cat]");
            if (!btn) return;
            document.querySelectorAll("#category-filters button").forEach(function (b) { b.classList.toggle("is-active", b === btn); });
            render(ReynoldsCatalog.byCategory(btn.getAttribute("data-cat")));
          });
        })();
      </script>
  </main>
  <div id="site-footer-root"></div>
  <script src="/js/site-chrome.js"></script>
</body>
</html>
