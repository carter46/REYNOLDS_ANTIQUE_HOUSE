<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection | Reynolds Antique House</title>
  <meta name="description" content="Browse the Reynolds Antique House collection." />
  <meta name="theme-color" content="#1a1410" />
  <link rel="stylesheet" href="/assets/vendor/bootstrap/bootstrap.min.css?v=1789992304326" />
  <link rel="stylesheet" href="/assets/fonts/typekit/tid5nrh.css" />
  <link rel="stylesheet" href="/assets/css/chrome.css?v=1789992304326" />
  <link rel="stylesheet" href="/assets/css/newel/BrowseALL.css" />
  <link rel="stylesheet" href="/assets/css/newel/styles.css?v=1789992304326" />
  <style>
    .rah-collection { padding: 1.5rem 0 3rem; }
    .rah-collection .category-title {
      font-size: 36px; font-weight: 300; font-family: ASTORIA, Georgia, serif;
      text-align: center; margin: 1rem 0 .25rem; color: #000;
    }
    .rah-collection .category-breadcrumb {
      justify-content: center; font-size: 13px; margin-bottom: 1.25rem;
    }
    .rah-collection #collection-lead {
      text-align: center; color: #6b5e52; margin-bottom: 1.5rem; font-size: 14px;
    }
    .rah-collection .rah-cat-sidebar {
      padding: 0 12px 24px;
    }
    .rah-collection .rah-cat-sidebar .filter-menu {
      display: block; font: 600 12px/1.2 ASTORIA, Georgia, serif;
      letter-spacing: .12em; text-transform: uppercase; color: #000;
      padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,.12); margin-bottom: 8px;
    }
    .rah-collection .rah-cat-sidebar button {
      display: block; width: 100%; text-align: left; background: transparent;
      border: 0; padding: 8px 4px; font: 400 13px/1.3 ASTORIA, Georgia, serif;
      color: #333; cursor: pointer;
    }
    .rah-collection .rah-cat-sidebar button.is-active,
    .rah-collection .rah-cat-sidebar button:hover {
      color: #800000; font-weight: 600;
    }
    .rah-collection .featured_container {
      position: relative; top: 0;
    }
    .rah-collection #product-grid > .imgboxsplit {
      margin-bottom: 8px;
    }
    @media (max-width: 991px) {
      .rah-collection .rah-cat-sidebar {
        display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 0 16px 16px;
      }
      .rah-collection .rah-cat-sidebar .filter-menu { width: 100%; }
      .rah-collection .rah-cat-sidebar button {
        width: auto; border: 1px solid rgba(0,0,0,.2); padding: 6px 12px; border-radius: 2px;
      }
      .rah-collection .rah-cat-sidebar button.is-active {
        background: #111; color: #fff; border-color: #111;
      }
    }
  </style>
</head>
<body data-page="products">
  <div id="site-header-root"></div>
  <main id="main">
    <section class="rah-collection container-fluid">
      <h1 class="category-title">Collection</h1>
      <ol class="breadcrumb category-breadcrumb">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Collection</li>
      </ol>
      <p id="collection-lead">Gallery inventory with complete local imagery.</p>
      <div class="row">
        <aside class="col-lg-2 col-xl-2 d-lg-block rah-cat-sidebar" id="category-filters">
          <span class="filter-menu">Category</span>
          <button type="button" data-cat="all" class="is-active">All</button>
          <button type="button" data-cat="Furniture">Furniture</button>
          <button type="button" data-cat="Sculpture">Sculpture</button>
          <button type="button" data-cat="Mirrors">Mirrors</button>
          <button type="button" data-cat="Lighting">Lighting</button>
          <button type="button" data-cat="Decor">Decor</button>
          <button type="button" data-cat="Art">Art</button>
          <button type="button" data-cat="Accessories">Accessories</button>
        </aside>
        <div class="col-lg-10 col-xl-10">
          <div class="container-fluid featured_container" style="position:relative;top:0;">
            <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-2" id="product-grid"></div>
          </div>
        </div>
      </div>
    </section>
    <script src="/js/product-catalog.js?v=1789992304326"></script>
    <script>
      (async function () {
        await ReynoldsCatalog.load();
        const grid = document.getElementById("product-grid");
        const lead = document.getElementById("collection-lead");
        const params = new URLSearchParams(window.location.search);
        const q = params.get("q") || "";
        const initialCat = params.get("cat") || "all";
        function wrapCard(html) {
          return '<div class="col imgboxsplit">' + html + "</div>";
        }
        function render(list) {
          grid.innerHTML = list.map(function (p) {
            return wrapCard(ReynoldsCatalog.cardHtml(p));
          }).join("");
        }
        function activate(cat) {
          document.querySelectorAll("#category-filters button").forEach(function (b) {
            b.classList.toggle("is-active", b.getAttribute("data-cat") === cat);
          });
          let list = ReynoldsCatalog.byCategory(cat);
          if (q) {
            list = ReynoldsCatalog.search(q).filter(function (p) {
              if (!cat || cat === "all") return true;
              return (p.category || "").toLowerCase().includes(cat.toLowerCase());
            });
          }
          render(list);
          lead.textContent = q
            ? ('Search results for "' + q + '" — ' + list.length + " pieces")
            : (list.length + " pieces with complete local imagery.");
        }
        if (q) {
          setTimeout(function () {
            const el = document.getElementById("search-input");
            if (el) el.value = q;
          }, 0);
        }
        const known = Array.from(document.querySelectorAll("#category-filters button")).map(function (b) {
          return b.getAttribute("data-cat");
        });
        activate(known.indexOf(initialCat) >= 0 ? initialCat : "all");
        document.getElementById("category-filters").addEventListener("click", function (e) {
          const btn = e.target.closest("button[data-cat]");
          if (!btn) return;
          const cat = btn.getAttribute("data-cat");
          activate(cat);
          const url = new URL(window.location.href);
          if (cat === "all") url.searchParams.delete("cat");
          else url.searchParams.set("cat", cat);
          if (q) url.searchParams.set("q", q);
          history.replaceState(null, "", url.pathname + url.search);
        });
      })();
    </script>
  </main>
  <div id="site-footer-root"></div>
  <script src="/js/site-chrome.js?v=1789992304326"></script>
</body>
</html>
