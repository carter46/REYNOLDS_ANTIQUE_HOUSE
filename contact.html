<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Reynolds Antique House</title>
  <meta name="description" content="Contact Reynolds Antique House." />
  <meta name="theme-color" content="#1a1410" />
  <link rel="stylesheet" href="/assets/css/chrome.css?v=1789985804003" />
</head>
<body data-page="contact">
  <div id="site-header-root"></div>
  <main id="main">
    <section class="rah-page">
      <h1 class="rah-section-title">Contact</h1>
      <p class="rah-section-lead">Reach Reynolds Antique House. This static form opens your mail client — no remote form backend or reCAPTCHA.</p>
      <div style="display:grid;gap:2rem;max-width:960px;margin:0 auto;grid-template-columns:1fr;">
        <div class="rah-prose" style="text-align:left;">
          <h2 style="text-align:left;font-size:1.35rem;">Gallery</h2>
          <p>New York City · Est. 1939 lineage</p>
          <p><a href="mailto:info@reynoldsantiquehouse.com">info@reynoldsantiquehouse.com</a></p>
          <p><a href="/estate-services.html">Sell / Consign / Estate Services</a></p>
        </div>
        <form class="rah-contact-form" action="mailto:info@reynoldsantiquehouse.com" method="post" enctype="text/plain">
          <label for="name">Name</label>
          <input id="name" name="name" required />
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
          <button class="rah-btn" type="submit">Send Email</button>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer-root"></div>
  <script src="/js/site-chrome.js?v=1789985804003"></script>
</body>
</html>
