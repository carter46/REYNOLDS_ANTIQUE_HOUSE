<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product | Reynolds Antique House</title>
  <meta name="description" content="Product details — Reynolds Antique House." />
  <meta name="theme-color" content="#1a1410" />
  <link rel="stylesheet" href="/assets/vendor/bootstrap/bootstrap.min.css?v=1790123600001" />
  <link rel="stylesheet" href="/assets/fonts/typekit/tid5nrh.css" />
  <link rel="stylesheet" href="/assets/css/chrome.css?v=1790123600001" />
  <link rel="stylesheet" href="/assets/css/newel/styles.css?v=1790123600001" />
  <link rel="stylesheet" href="/assets/css/newel/productinfo.css" />
  <link rel="stylesheet" href="/assets/css/newel/NEWEL-PRODUCT-INFO.css?v=1790123600001" />
  <link rel="stylesheet" href="/assets/css/newel/flexslider.css" />
</head>
<body data-page="product">
  <div id="site-header-root"></div>
  <main id="main">
    <section class="rah-page rah-pdp-page">
      <div id="pdp-root"><p>Loading…</p></div>
      <div class="container-fluid related_item_container" style="margin-top:3rem;">
        <h2 class="rah-section-title" style="margin-bottom:1rem;">Related items</h2>
        <div class="container-fluid featured_container" style="position:relative;top:0;">
          <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-2" id="related-grid"></div>
        </div>
      </div>
    </section>
    <script src="/js/product-catalog.js?v=1790123600001"></script>
    <script>
      (async function () {
        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        await ReynoldsCatalog.load();
        const params = new URLSearchParams(window.location.search);
        let id = params.get("id");
        if (!id && window.location.hash) {
          const hash = window.location.hash.replace(/^#/, "");
          const hp = new URLSearchParams(hash);
          id = hp.get("id") || (hash.indexOf("=") === -1 ? hash : null);
        }
        if (!id) {
          const parts = window.location.pathname.split("/").filter(Boolean);
          const last = parts[parts.length - 1] || "";
          if (last && last !== "product-details" && last !== "product-details.html") {
            id = last.replace(/\.html$/i, "");
          }
        }
        const product = ReynoldsCatalog.getProduct(id);
        const root = document.getElementById("pdp-root");
        if (!product) {
          root.innerHTML = '<p>Product not found. <a href="/products.html">Return to the collection</a>.</p>';
          return;
        }
        document.title = product.title + " | Reynolds Antique House";
        const images = product.images && product.images.length ? product.images : [{ src: "", alt: product.title }];
        let index = 0;

        function productDimensionsText(p) {
          if (p.width || p.depth || p.height) {
            return [
              p.width ? ("Width: " + p.width) : "",
              p.depth ? ("Depth: " + p.depth) : "",
              p.height ? ("Height: " + p.height) : ""
            ].filter(Boolean).join(" · ");
          }
          if (p.dimensions) return String(p.dimensions).replace(/\s+/g, " ").trim();
          return "";
        }

        function fillProductFields(p) {
          var set = function (id, val) {
            var el = document.getElementById(id);
            if (el) el.value = val == null ? "" : String(val);
          };
          set("inq-product-title", p.title || "");
          set("inq-product-sku", p.sku || "");
          set("inq-product-id", p.id || "");
          set("inq-product-url", window.location.href);
          set("inq-product-price", p.price || "");
          set("inq-product-category", p.category || "");
          set("inq-product-style", p.style || "");
          set("inq-product-material", p.material || "");
          set("inq-product-period", p.period || "");
          set("inq-product-availability", p.availability || "");
          set("inq-product-dimensions", productDimensionsText(p));
          var label = document.getElementById("inq-product-label");
          if (label) {
            var bits = [p.title || "This piece"];
            if (p.sku) bits.push("#" + p.sku);
            if (p.price) bits.push(p.price);
            label.textContent = bits.join(" · ");
          }
          var summary = document.getElementById("inq-product-summary");
          if (summary) {
            var lines = [];
            if (p.category) lines.push("Category: " + p.category);
            if (p.style) lines.push("Style: " + p.style);
            if (p.material) lines.push("Material: " + p.material);
            var dims = productDimensionsText(p);
            if (dims) lines.push("Dimensions: " + dims);
            summary.textContent = lines.join(" · ");
            summary.hidden = lines.length === 0;
          }
        }

        function setInquirySubmitting(isSubmitting) {
          var submitBtn = document.getElementById("inq-submit");
          if (!submitBtn) return;
          submitBtn.disabled = !!isSubmitting;
          submitBtn.classList.toggle("is-loading", !!isSubmitting);
          submitBtn.setAttribute("aria-busy", isSubmitting ? "true" : "false");
        }

        function showInquirySuccess() {
          var form = document.getElementById("inquiry-form");
          var success = document.getElementById("inq-success");
          var heading = document.getElementById("inq-heading");
          var label = document.getElementById("inq-product-label");
          var summary = document.getElementById("inq-product-summary");
          if (form) form.hidden = true;
          if (label) label.hidden = true;
          if (summary) summary.hidden = true;
          if (heading) heading.textContent = "Thank you";
          if (success) {
            success.hidden = false;
            var closeBtn = document.getElementById("inq-success-close");
            if (closeBtn) closeBtn.focus();
          }
        }

        function resetInquiryView() {
          var form = document.getElementById("inquiry-form");
          var success = document.getElementById("inq-success");
          var heading = document.getElementById("inq-heading");
          var label = document.getElementById("inq-product-label");
          var status = document.getElementById("inq-status");
          if (form) form.hidden = false;
          if (success) success.hidden = true;
          if (heading) heading.textContent = "Inquire about this piece";
          if (label) label.hidden = false;
          if (status) {
            status.hidden = true;
            status.textContent = "";
            status.className = "rah-inquiry-status";
          }
          setInquirySubmitting(false);
        }

        function openInquiryModal(p) {
          var modal = document.getElementById("inquiry-modal");
          var form = document.getElementById("inquiry-form");
          if (!modal || !form) return;
          resetInquiryView();
          form.reset();
          fillProductFields(p);
          modal.hidden = false;
          document.body.classList.add("rah-inquiry-open");
          var nameEl = document.getElementById("inq-name");
          if (nameEl) nameEl.focus();
        }

        function closeInquiryModal() {
          var modal = document.getElementById("inquiry-modal");
          if (!modal || modal.hidden) return;
          modal.hidden = true;
          document.body.classList.remove("rah-inquiry-open");
          resetInquiryView();
          var inquireBtn = document.getElementById("inquire-open");
          if (inquireBtn) inquireBtn.focus();
        }

        function paint() {
          const img = images[index] || images[0];
          root.innerHTML =
            '<div class="rah-pdp">' +
            '<div><div class="rah-gallery-main"><img id="pdp-main" src="' + esc(img.src || "") + '" alt="' + esc(img.alt || product.title) + '" /></div>' +
            '<div class="rah-thumbs" id="pdp-thumbs">' +
            images.map(function (im, i) {
              return '<button type="button" data-i="' + i + '" class="' + (i === index ? "is-active" : "") + '"><img src="' + esc(im.src) + '" alt="" /></button>';
            }).join("") +
            "</div></div>" +
            "<div>" +
            '<h1 class="rah-pdp-title">' + esc(product.title) + "</h1>" +
            (product.price ? '<p class="rah-pdp-price">' + esc(product.price) + "</p>" : "") +
            '<p class="rah-pdp-sku">' + (product.sku ? "Item # " + esc(product.sku) : "") + "</p>" +
            '<p class="rah-pdp-desc">' + esc(product.description || "") + "</p>" +
            '<ul class="rah-specs">' +
            (function () {
              if (product.dimensionsHtml) {
                return "<li><strong>Dimensions</strong><br>" + product.dimensionsHtml + "</li>";
              }
              if (product.width || product.depth || product.height) {
                return (
                  "<li><strong>Dimensions</strong><br>" +
                  [product.width && ("Width: " + esc(product.width)), product.depth && ("Depth: " + esc(product.depth)), product.height && ("Height: " + esc(product.height))]
                    .filter(Boolean)
                    .join("<br>") +
                  "</li>"
                );
              }
              if (product.dimensions) {
                return "<li><strong>Dimensions</strong><br>" + esc(String(product.dimensions)).replace(/\n/g, "<br>") + "</li>";
              }
              return "";
            })() +
            (product.material ? "<li><strong>Material</strong> " + esc(product.material) + "</li>" : "") +
            (product.style ? "<li><strong>Style</strong> " + esc(product.style) + "</li>" : "") +
            (product.period ? "<li><strong>Period</strong> " + esc(product.period) + "</li>" : "") +
            (product.category ? "<li><strong>Category</strong> " + esc(product.category) + "</li>" : "") +
            (product.availability ? "<li><strong>Status</strong> " + esc(product.availability) + "</li>" : "") +
            "</ul>" +
            '<button type="button" class="rah-btn" id="inquire-open" data-inquire>Inquire</button>' +
            ' <a class="rah-btn" style="background:transparent;color:var(--rah-ink)!important;border:1px solid rgba(0,0,0,.2)" href="/products.html">Back to Collection</a>' +
            "</div></div>";
          document.getElementById("pdp-thumbs").addEventListener("click", function (e) {
            const btn = e.target.closest("button[data-i]");
            if (!btn) return;
            index = parseInt(btn.getAttribute("data-i"), 10) || 0;
            paint();
          });
          var inquireBtn = document.getElementById("inquire-open");
          if (inquireBtn) {
            inquireBtn.addEventListener("click", function () {
              openInquiryModal(product);
            });
          }
        }

        paint();
        const related = ReynoldsCatalog.related(product, 8);
        document.getElementById("related-grid").innerHTML = related.map(function (p) {
          return '<div class="col imgboxsplit">' + ReynoldsCatalog.cardHtml(p) + "</div>";
        }).join("");

        var modal = document.getElementById("inquiry-modal");
        var form = document.getElementById("inquiry-form");
        if (!modal || !form) return;

        modal.addEventListener("click", function (e) {
          if (e.target.closest("[data-inquiry-close]")) closeInquiryModal();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeInquiryModal();
        });
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          var status = document.getElementById("inq-status");
          var submitBtn = document.getElementById("inq-submit");
          status.hidden = true;
          status.className = "rah-inquiry-status";
          fillProductFields(product);
          var payload = {
            name: form.name.value.trim(),
            email: form.email.value.trim(),
            phone: form.phone.value.trim(),
            message: form.message.value.trim(),
            product_title: form.product_title.value,
            product_sku: form.product_sku.value,
            product_id: form.product_id.value,
            product_url: form.product_url.value || window.location.href,
            product_price: form.product_price.value,
            product_category: form.product_category.value,
            product_style: form.product_style.value,
            product_material: form.product_material.value,
            product_period: form.product_period.value,
            product_availability: form.product_availability.value,
            product_dimensions: form.product_dimensions.value,
            website: form.website.value
          };
          setInquirySubmitting(true);
          try {
            var res = await fetch("/inquiry.php", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json"
              },
              body: JSON.stringify(payload),
              credentials: "same-origin"
            });
            var data = {};
            try {
              data = await res.json();
            } catch (err) {
              data = {};
            }
            if (res.ok && data.ok) {
              form.reset();
              fillProductFields(product);
              showInquirySuccess();
            } else {
              status.textContent =
                (data && data.error) || "Unable to send your inquiry right now. Please try again later.";
              status.className = "rah-inquiry-status is-error";
              status.hidden = false;
              setInquirySubmitting(false);
            }
          } catch (err) {
            status.textContent = "Unable to send your inquiry right now. Please try again later.";
            status.className = "rah-inquiry-status is-error";
            status.hidden = false;
            setInquirySubmitting(false);
          }
        });
      })();
    </script>
  </main>
  <div id="inquiry-modal" class="rah-inquiry-modal" hidden>
    <div class="rah-inquiry-backdrop" data-inquiry-close></div>
    <div class="rah-inquiry-dialog" role="dialog" aria-modal="true" aria-labelledby="inq-heading">
      <button type="button" class="rah-inquiry-close" data-inquiry-close aria-label="Close inquiry form">&times;</button>
      <h2 id="inq-heading">Inquire about this piece</h2>
      <p class="rah-inquiry-product" id="inq-product-label"></p>
      <p class="rah-inquiry-product-summary" id="inq-product-summary" hidden></p>
      <form id="inquiry-form" class="rah-inquiry-form" novalidate>
        <input type="hidden" name="product_title" id="inq-product-title" />
        <input type="hidden" name="product_sku" id="inq-product-sku" />
        <input type="hidden" name="product_id" id="inq-product-id" />
        <input type="hidden" name="product_url" id="inq-product-url" />
        <input type="hidden" name="product_price" id="inq-product-price" />
        <input type="hidden" name="product_category" id="inq-product-category" />
        <input type="hidden" name="product_style" id="inq-product-style" />
        <input type="hidden" name="product_material" id="inq-product-material" />
        <input type="hidden" name="product_period" id="inq-product-period" />
        <input type="hidden" name="product_availability" id="inq-product-availability" />
        <input type="hidden" name="product_dimensions" id="inq-product-dimensions" />
        <div class="rah-inquiry-hp" aria-hidden="true">
          <label for="inq-website">Website</label>
          <input type="text" name="website" id="inq-website" tabindex="-1" autocomplete="off" />
        </div>
        <label for="inq-name">Name <span aria-hidden="true">*</span></label>
        <input type="text" name="name" id="inq-name" required maxlength="120" autocomplete="name" />
        <label for="inq-email">Email <span aria-hidden="true">*</span></label>
        <input type="email" name="email" id="inq-email" required maxlength="200" autocomplete="email" />
        <label for="inq-phone">Phone <span class="rah-inquiry-optional">(optional)</span></label>
        <input type="tel" name="phone" id="inq-phone" maxlength="40" autocomplete="tel" />
        <label for="inq-message">Message <span aria-hidden="true">*</span></label>
        <textarea name="message" id="inq-message" required maxlength="4000" rows="5"></textarea>
        <p id="inq-status" class="rah-inquiry-status" hidden></p>
        <div class="rah-inquiry-actions">
          <button type="submit" class="rah-btn" id="inq-submit">
            <span class="rah-inquiry-btn-label">Send inquiry</span>
            <span class="rah-inquiry-spinner" aria-hidden="true"></span>
          </button>
          <button type="button" class="rah-btn rah-btn--ghost" data-inquiry-close>Cancel</button>
        </div>
      </form>
      <div id="inq-success" class="rah-inquiry-success" hidden>
        <p class="rah-inquiry-success-lead">Thank you for contacting us.</p>
        <p>Your inquiry has been sent to our sales team. We&rsquo;ll get back in touch with you as soon as possible.</p>
        <div class="rah-inquiry-actions">
          <button type="button" class="rah-btn" id="inq-success-close" data-inquiry-close>Close</button>
        </div>
      </div>
    </div>
  </div>
  <div id="site-footer-root"></div>
  <script src="/js/site-chrome.js?v=1790123600001"></script>
</body>
</html>
